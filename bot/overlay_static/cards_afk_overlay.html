<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Trading Cards AFK Overlay</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&family=Russo+One&display=swap" rel="stylesheet">
  <style>
    html, body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 50%, #16213e 100%);
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
    }

    /* AFK Status Banner */
    .afk-banner {
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
      background-size: 300% 300%;
      animation: gradientShift 3s ease infinite;
      padding: 20px 60px;
      border-radius: 50px;
      z-index: 1000;
      box-shadow: 0 0 30px rgba(255, 107, 107, 0.6);
    }

    .afk-text {
      font-family: 'Russo One', sans-serif;
      font-size: 36px;
      font-weight: bold;
      text-align: center;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      letter-spacing: 3px;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Trading Card Grid Container */
    .card-grid-container {
      position: absolute;
      top: 150px;
      left: 50%;
      transform: translateX(-50%);
      width: 1400px;
      height: 800px;
      perspective: 1000px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 30px;
      width: 100%;
      height: 100%;
      padding: 40px;
    }

    /* Individual Card Container */
    .card-container {
      position: relative;
      width: 220px;
      height: 300px;
      margin: 0 auto;
    }

    .card {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 15px;
      box-shadow: 
        0 10px 30px rgba(0,0,0,0.5),
        0 0 20px rgba(255,255,255,0.1);
      transition: all 0.6s ease;
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .card.flipping {
      animation: cardFlip 1s ease-in-out;
    }

    @keyframes cardFlip {
      0% { 
        transform: rotateY(0deg) scale(1); 
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
      25% { 
        transform: rotateY(-90deg) scale(1.1); 
        box-shadow: 0 15px 50px rgba(255,215,0,0.4);
      }
      75% { 
        transform: rotateY(90deg) scale(1.1); 
        box-shadow: 0 15px 50px rgba(255,215,0,0.4);
      }
      100% { 
        transform: rotateY(0deg) scale(1); 
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
    }

    /* Card Types */
    .card.psa-slab {
      background: linear-gradient(145deg, #e8e8e8, #c0c0c0);
      border: 3px solid #1e90ff;
    }

    .card.raw-card {
      background: linear-gradient(145deg, #2c2c2c, #1a1a1a);
      border: 2px solid #ffd700;
    }

    .card.bgs-slab {
      background: linear-gradient(145deg, #f0f0f0, #d0d0d0);
      border: 3px solid #8b0000;
    }

    .card.sgc-slab {
      background: linear-gradient(145deg, #e0e0e0, #b8b8b8);
      border: 3px solid #228b22;
    }

    /* Card Content */
    .card-content {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 15px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card-image {
      width: 80%;
      height: 60%;
      background: #333;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 12px;
      background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23333"/><text x="50" y="50" text-anchor="middle" fill="%23888" font-size="8">CARD IMAGE</text></svg>');
      background-size: cover;
      background-position: center;
    }

    .card-info {
      text-align: center;
      color: white;
      font-size: 10px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    .card-name {
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 11px;
    }

    .card-grade {
      background: rgba(255,215,0,0.2);
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 9px;
      border: 1px solid #ffd700;
    }

    /* Ticker Display */
    .ticker-container {
      position: fixed;
      bottom: 30px;
      left: 0;
      width: 100%;
      height: 60px;
      background: linear-gradient(90deg, 
        rgba(0,0,0,0.9) 0%, 
        rgba(0,0,0,0.7) 50%, 
        rgba(0,0,0,0.9) 100%);
      display: flex;
      align-items: center;
      overflow: hidden;
      z-index: 100;
    }

    .ticker-content {
      white-space: nowrap;
      font-family: 'Roboto Mono', monospace;
      font-size: 18px;
      color: #00ff88;
      text-shadow: 0 0 10px #00ff88;
      animation: tickerScroll 30s linear infinite;
      padding-left: 100%;
    }

    @keyframes tickerScroll {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-100%); }
    }

    /* Glowing particles effect */
    .particles-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #ffd700;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffd700;
      animation: float 6s ease-in-out infinite;
      opacity: 0.7;
    }

    @keyframes float {
      0%, 100% { 
        transform: translateY(0px) translateX(0px); 
        opacity: 0.7; 
      }
      50% { 
        transform: translateY(-20px) translateX(10px); 
        opacity: 1; 
      }
    }

    /* Responsive adjustments */
    @media (max-width: 1920px) {
      .card-grid-container {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <!-- AFK Status Banner -->
  <div class="afk-banner">
    <div class="afk-text">AFK - BROWSING CARDS</div>
  </div>

  <!-- Particles Background Effect -->
  <div class="particles-container" id="particles"></div>

  <!-- Trading Card Grid -->
  <div class="card-grid-container">
    <div class="card-grid" id="cardGrid">
      <!-- Cards will be generated by JavaScript -->
    </div>
  </div>

  <!-- Ticker Display -->
  <div class="ticker-container">
    <div class="ticker-content" id="tickerContent">
      Loading stream information...
    </div>
  </div>

  <script>
    // Dynamic trading card data loaded from filesystem
    let tradingCards = [];

    let currentCardSet = [];
    let rotationInterval;

    // Load card data from API
    async function loadCardData() {
      try {
        const response = await fetch('/api/cards');
        const data = await response.json();
        
        if (data.cards && data.cards.length > 0) {
          tradingCards = data.cards;
          console.log(`Loaded ${tradingCards.length} cards from directory`);
        } else {
          console.warn('No cards found in directory, using fallback data');
          // Use sample data if no cards found
          tradingCards = [
            { name: "No Cards Found", year: "2024", set: "Placeholder", grade: "Raw", type: "raw-card", rarity: "Info", image: null }
          ];
        }
        
        if (data.error) {
          console.error('Card loading error:', data.error);
        }
        
      } catch (error) {
        console.error('Failed to load cards:', error);
        // Fallback sample data
        tradingCards = [
          { name: "Loading Error", year: "2024", set: "Error", grade: "Raw", type: "raw-card", rarity: "Error", image: null }
        ];
      }
    }

    // Initialize the card grid
    async function initializeCardGrid() {
      // Load card data first
      await loadCardData();
      const grid = document.getElementById('cardGrid');
      currentCardSet = getRandomCards(15); // Fill 3x5 grid
      
      grid.innerHTML = '';
      currentCardSet.forEach((card, index) => {
        const cardElement = createCardElement(card, index);
        grid.appendChild(cardElement);
      });
    }

    // Get random cards from the collection
    function getRandomCards(count) {
      const shuffled = [...tradingCards].sort(() => 0.5 - Math.random());
      return shuffled.slice(0, count);
    }

    // Create individual card element
    function createCardElement(cardData, index) {
      const container = document.createElement('div');
      container.className = 'card-container';
      
      const card = document.createElement('div');
      card.className = `card ${cardData.type}`;
      card.style.animationDelay = `${index * 0.1}s`;
      
      const content = document.createElement('div');
      content.className = 'card-content';
      
      const image = document.createElement('div');
      image.className = 'card-image';
      
      // Set background image if available
      if (cardData.image) {
        image.style.backgroundImage = `url('${cardData.image}')`;
        image.style.backgroundSize = 'cover';
        image.style.backgroundPosition = 'center';
        image.style.backgroundRepeat = 'no-repeat';
      } else {
        // Placeholder gradient for missing images
        image.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
      }
      
      const info = document.createElement('div');
      info.className = 'card-info';
      
      const name = document.createElement('div');
      name.className = 'card-name';
      name.textContent = cardData.name;
      
      const details = document.createElement('div');
      details.textContent = `${cardData.year} ${cardData.set}`;
      
      const grade = document.createElement('div');
      grade.className = 'card-grade';
      grade.textContent = cardData.grade;
      
      info.appendChild(name);
      info.appendChild(details);
      info.appendChild(grade);
      
      content.appendChild(image);
      content.appendChild(info);
      card.appendChild(content);
      container.appendChild(card);
      
      return container;
    }

    // Rotate cards with animation
    function rotateCards() {
      const cards = document.querySelectorAll('.card');
      const numCardsToRotate = Math.floor(Math.random() * 5) + 3; // Rotate 3-7 cards
      const cardsToRotate = [];
      
      // Randomly select cards to rotate
      while (cardsToRotate.length < numCardsToRotate) {
        const randomIndex = Math.floor(Math.random() * cards.length);
        if (!cardsToRotate.includes(randomIndex)) {
          cardsToRotate.push(randomIndex);
        }
      }
      
      // Animate selected cards
      cardsToRotate.forEach((cardIndex, delay) => {
        setTimeout(() => {
          const cardElement = cards[cardIndex];
          if (cardElement) {
            cardElement.classList.add('flipping');
            
            // Replace card content mid-animation
            setTimeout(() => {
              const newCard = tradingCards[Math.floor(Math.random() * tradingCards.length)];
              updateCardContent(cardElement, newCard);
            }, 500);
            
            // Remove animation class
            setTimeout(() => {
              cardElement.classList.remove('flipping');
            }, 1000);
          }
        }, delay * 200);
      });
    }

    // Update card content during rotation
    function updateCardContent(cardElement, newCardData) {
      // Update card type class
      cardElement.className = `card ${newCardData.type}`;
      
      const nameElement = cardElement.querySelector('.card-name');
      const detailsElement = cardElement.querySelector('.card-info div:nth-child(2)');
      const gradeElement = cardElement.querySelector('.card-grade');
      
      if (nameElement) nameElement.textContent = newCardData.name;
      if (detailsElement) detailsElement.textContent = `${newCardData.year} ${newCardData.set}`;
      if (gradeElement) gradeElement.textContent = newCardData.grade;
    }

    // Create floating particles
    function createParticles() {
      const container = document.getElementById('particles');
      const particleCount = 15;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 6 + 's';
        particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
        container.appendChild(particle);
      }
    }

    // WebSocket connection for ticker updates
    function connectWebSocket() {
      try {
        const ws = new WebSocket('ws://localhost:8080');
        
        ws.onopen = function() {
          console.log('Connected to overlay server');
          // Request latest ticker on connect
          ws.send(JSON.stringify({type: 'request_latest_ticker'}));
        };
        
        ws.onmessage = function(event) {
          try {
            const data = JSON.parse(event.data);
            if (data.type === 'ticker') {
              document.getElementById('tickerContent').textContent = data.text || 'No ticker data available';
            }
          } catch (e) {
            console.error('Error parsing WebSocket message:', e);
          }
        };
        
        ws.onerror = function(error) {
          console.error('WebSocket error:', error);
          document.getElementById('tickerContent').textContent = 'Connection error - ticker unavailable';
        };
        
        ws.onclose = function() {
          console.log('WebSocket connection closed, attempting to reconnect...');
          setTimeout(connectWebSocket, 3000);
        };
      } catch (error) {
        console.error('Failed to establish WebSocket connection:', error);
        document.getElementById('tickerContent').textContent = 'WebSocket unavailable - ticker offline';
      }
    }

    // Initialize everything when page loads
    document.addEventListener('DOMContentLoaded', async function() {
      await initializeCardGrid();
      createParticles();
      connectWebSocket();
      
      // Start card rotation every 8-15 seconds
      rotationInterval = setInterval(rotateCards, Math.random() * 7000 + 8000);
      
      // Add some randomness to particle creation
      setInterval(() => {
        if (Math.random() > 0.7) {
          const container = document.getElementById('particles');
          if (container.children.length < 20) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
            container.appendChild(particle);
            
            // Remove particle after animation
            setTimeout(() => {
              if (particle.parentNode) {
                particle.parentNode.removeChild(particle);
              }
            }, 10000);
          }
        }
      }, 2000);
    });
  </script>
</body>
</html>
