<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giveaway</title>
  <style>
    :root { color-scheme: dark; --red: #ef233c; --gold: #ffd166; --ink: #101216; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; overflow: hidden; color: #f7f8fa;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #101216 0 55%, #20242b 55% 100%);
    }
    main { height: 100vh; display: grid; grid-template-rows: auto auto 1fr; padding: 28px; gap: 18px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 24px; border-bottom: 5px solid var(--red); padding-bottom: 14px; }
    .eyebrow { color: var(--red); font-weight: 900; text-transform: uppercase; font-size: 20px; }
    h1 { margin: 2px 0 0; font-size: clamp(42px, 6vw, 92px); line-height: .95; overflow-wrap: anywhere; }
    #status { background: #303640; padding: 10px 18px; border-radius: 6px; font-weight: 900; font-size: 22px; white-space: nowrap; }
    #status.open { background: #167548; }
    .instruction { font-size: clamp(22px, 3vw, 42px); font-weight: 700; }
    .instruction b { color: var(--gold); }
    #grid { min-height: 0; display: grid; grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); grid-auto-rows: minmax(46px, 1fr); gap: 10px; }
    .entrant { display: grid; place-items: center; min-width: 0; padding: 8px; border: 2px solid #4b5360; border-radius: 6px; background: #252a31; font-size: var(--tile-size, 28px); font-weight: 800; overflow-wrap: anywhere; text-align: center; transition: .12s ease; }
    .entrant.active { color: var(--ink); background: var(--gold); border-color: #fff; transform: scale(1.06); box-shadow: 0 0 28px var(--gold); z-index: 2; }
    #winner { position: fixed; inset: 0; display: none; place-items: center; background: rgba(8, 9, 12, .91); z-index: 10; }
    #winner.show { display: grid; animation: reveal .7s ease-out; }
    .winner-plate { width: min(90vw, 1200px); padding: 42px; text-align: center; border: 7px solid var(--gold); background: var(--red); box-shadow: 0 0 0 12px #fff, 0 0 80px var(--gold); transform: rotate(-1deg); }
    .winner-plate small { display: block; font-size: clamp(24px, 3vw, 48px); font-weight: 900; text-transform: uppercase; }
    #winner-name { font-size: 170px; font-weight: 1000; line-height: 1; white-space: nowrap; overflow: hidden; }
    #winner-prize { margin-top: 14px; font-size: clamp(24px, 3vw, 48px); font-weight: 800; }
    @keyframes reveal { from { opacity: 0; transform: scale(.65) rotate(-3deg); } 70% { transform: scale(1.05); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <main>
    <header><div><div class="eyebrow">Current Giveaway</div><h1 id="prize">Waiting for a prize</h1></div><div id="status">WAITING</div></header>
    <div class="instruction">Enter in chat with <b id="entry">the giveaway word</b> <span id="count">0 entrants</span></div>
    <section id="grid" aria-label="Giveaway entrants"></section>
  </main>
  <section id="winner"><div class="winner-plate"><small>Winner</small><div id="winner-name"></div><div id="winner-prize"></div></div></section>
  <script>
    const grid = document.getElementById("grid");
    const winnerPanel = document.getElementById("winner");
    let lastDrawId = 0;
    let drawing = false;

    function buildGrid(names) {
      grid.replaceChildren();
      const count = names.length;
      const cols = Math.max(2, Math.min(10, Math.ceil(Math.sqrt(count * 1.7))));
      grid.style.setProperty("--cols", cols);
      grid.style.setProperty("--tile-size", count > 70 ? "15px" : count > 35 ? "19px" : count > 18 ? "23px" : "30px");
      for (const name of names) {
        const tile = document.createElement("div");
        tile.className = "entrant";
        tile.dataset.name = name;
        tile.textContent = `@${name}`;
        grid.append(tile);
      }
    }

    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
    function fitWinnerName() {
      const name = document.getElementById("winner-name");
      const plate = name.closest(".winner-plate");
      const maxWidth = plate.clientWidth - 84;
      let size = 170;
      name.style.fontSize = `${size}px`;
      while (name.scrollWidth > maxWidth && size > 24) {
        size -= 2;
        name.style.fontSize = `${size}px`;
      }
    }

    async function animateDraw(data) {
      if (drawing || !data.entrants.length || !data.winner) return;
      drawing = true;
      winnerPanel.classList.remove("show");
      const tiles = [...grid.children];
      const winnerIndex = data.entrants.indexOf(data.winner);
      let index = Math.floor(Math.random() * tiles.length);
      const steps = 34 + ((winnerIndex - index - 34) % tiles.length + tiles.length) % tiles.length;
      for (let step = 0; step < steps; step++) {
        tiles.forEach(tile => tile.classList.remove("active"));
        index = (index + 1) % tiles.length;
        tiles[index].classList.add("active");
        await sleep(55 + Math.pow(step / steps, 3) * 330);
      }
      document.getElementById("winner-name").textContent = `@${data.winner}`;
      document.getElementById("winner-prize").textContent = data.prize || "Giveaway prize";
      winnerPanel.classList.add("show");
      fitWinnerName();
      drawing = false;
    }

    function render(data) {
      if (!data || data.type !== "giveaway_state") return;
      document.getElementById("prize").textContent = data.prize || "Waiting for a prize";
      document.getElementById("entry").textContent = data.entry_phrase ? `"${data.entry_phrase}"` : "the giveaway word";
      document.getElementById("count").textContent = ` • ${data.entrants.length} entrant${data.entrants.length === 1 ? "" : "s"}`;
      const status = document.getElementById("status");
      status.textContent = data.is_open ? "OPEN" : (data.prize ? "CLOSED" : "WAITING");
      status.classList.toggle("open", data.is_open);
      buildGrid(data.entrants || []);
      if (!data.animate) winnerPanel.classList.remove("show");
      if (data.animate && data.draw_id > lastDrawId) animateDraw(data);
      lastDrawId = Math.max(lastDrawId, data.draw_id || 0);
    }

    function connect() {
      const protocol = location.protocol === "https:" ? "wss" : "ws";
      const socket = new WebSocket(`${protocol}://${location.host}/ws`);
      socket.addEventListener("open", () => socket.send(JSON.stringify({type: "request_giveaway_state"})));
      socket.addEventListener("message", event => { try { render(JSON.parse(event.data)); } catch (_) {} });
      socket.addEventListener("close", () => setTimeout(connect, 2000));
      socket.addEventListener("error", () => socket.close());
    }
    connect();
  </script>
</body>
</html>
