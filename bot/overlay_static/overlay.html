<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
  html, body {
    width: 1920px;
    height: 1080px;
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }

  #ticker-bar {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 60px;
    display: flex;
    align-items: stretch;
    font-family: sans-serif;
    font-size: 32px;
    color: white;
  }

  #logo {
    background: #c00;
    color: white;
    padding: 0 20px;
    font-weight: bold;
    font-family: sans-serif;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    min-width: 120px;
    box-shadow: inset 0 -2px 0 rgba(255, 255, 255, 0.2);
    box-sizing: border-box;
    transition: background 0.3s;
  }

  #ticker-text {
    background: linear-gradient(to right, #111 0%, #222 100%);
    flex: 1;
    padding-left: 20px;
    white-space: nowrap;
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
    display: flex;
    align-items: center;
    height: 100%;
    box-sizing: border-box;
    position: relative;
  }

  #ticker-text {
    background: linear-gradient(to right, #111 0%, #222 100%);
    flex: 1;
    padding-left: 20px;
    white-space: nowrap;
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
    display: flex;
    align-items: center;
    height: 100%;
    box-sizing: border-box;
    position: relative;
  }
  .scrolling {
    will-change: transform;
    position: absolute;
    left: 100%;
    white-space: nowrap;
    animation: ticker-scroll linear;
    animation-fill-mode: forwards;
  }
  @keyframes ticker-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
  }

  /* Center display: reserve space at the bottom so it cannot overlap
     the ticker bar (ticker height is 60px). We leave an extra 20px gap. */
  #center-display {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    max-width: 80%;
    /* Prevent the displayed image from extending into the bottom ticker area. */
    max-height: calc(100vh - 80px); /* 60px ticker + 20px gap */
    display: none;
    z-index: 10;
    background: rgba(0,0,0,0.0);
    pointer-events: none;
  }
  #center-display img {
    display: block;
    margin: 0 auto;
    /* Constrain image to the available viewport while keeping the bottom gap. */
    max-width: calc(100vw - 40px);
    max-height: calc(100vh - 80px);
    width: auto;
    height: auto;
    object-fit: contain;
  }
  </style>
</head>
<body>
  <div id="ticker-bar">
    <div id="logo">DNN</div>
    <div id="ticker-text">Welcome to the Darmunist News Network.</div>
  </div>
  <div id="center-display"><img src="" alt="overlay" /></div>

<script>
window.onload = () => {
  const tickerText = document.getElementById("ticker-text");
  const defaultMessage = "Welcome to the Darmunist News Network.";
  const logo = document.getElementById("logo");
  const centerDisplay = document.getElementById("center-display");
  const centerImg = centerDisplay.querySelector("img");
  const FOLDERS = { heart: "gifs/heart/", gif: "gifs/" };
  const IMAGE_EXTENSIONS = [".gif", ".jpg", ".jpeg", ".png", ".webp"];
  const OVERLAY_DISPLAY_TIME = 2500;
  let categoryText = "DNN";
  function setLogo(text) {
    categoryText = (typeof text === "string" && text.length > 0) ? text : "DNN";
    logo.textContent = categoryText;
  }
  setLogo(categoryText);
  const ws = new WebSocket("ws://localhost:8080/ws");
  ws.onopen = () => { console.log("✅ WebSocket connection established."); };
  ws.onclose = (event) => { console.log("❌ WebSocket connection closed:", event); };
  ws.onerror = (err) => { console.error("❌ WebSocket error:", err); };
  let latestTicker = defaultMessage;
  let nextTicker = null;
  let isAnimating = false;
  ws.onmessage = (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch (err) { console.error("❌ Failed to parse message as JSON:", err); return; }
    if (msg.type === "ticker" && typeof msg.text === "string") {
      if (!isAnimating) { latestTicker = msg.text; startTickerScroll(latestTicker); } else { nextTicker = msg.text; }
      return;
    }
    if (msg.type === "image" && typeof msg.url === "string") { showCenterImage(msg.url, msg.duration || OVERLAY_DISPLAY_TIME); return; }
    if (msg.type === "logo" && typeof msg.text === "string") { setLogo(msg.text); return; }
    if (msg.action && typeof msg.action === "string") {
      const parsed = parseAction(msg.action);
      if (parsed) { const { folder, base } = parsed; tryImageExtensions(folder, base, OVERLAY_DISPLAY_TIME); } else { console.warn("⚠️ Couldn't parse overlay action:", msg.action); }
      return;
    }
    console.warn("⚠️ Unknown message format:", msg);
  };
  function startTickerScroll(text) {
    isAnimating = true;
    tickerText.innerHTML = '';
    const span = document.createElement('span');
    span.className = 'scrolling';
    span.textContent = text;
    tickerText.appendChild(span);
    const duration = Math.max(8, text.length * 0.22); // seconds
    span.style.animationDuration = duration + 's';
    let preloaded = false;
    span.addEventListener('animationend', () => {
      tickerText.innerHTML = '';
      isAnimating = false;
      if (nextTicker) { latestTicker = nextTicker; nextTicker = null; startTickerScroll(latestTicker); } else { startTickerScroll(latestTicker || defaultMessage); }
    });
    setTimeout(() => { if (nextTicker && !preloaded) { preloaded = true; } }, duration * 800);
  }
  // Center image display (for overlay commands)
  function showCenterImage(imgPath, duration) {
    centerImg.src = imgPath;
    centerDisplay.style.display = 'block';
    clearTimeout(centerDisplay._hideTimeout);
    centerDisplay._hideTimeout = setTimeout(() => {
      centerDisplay.style.display = 'none';
      centerImg.src = '';
    }, duration);
  }
}
</script>
