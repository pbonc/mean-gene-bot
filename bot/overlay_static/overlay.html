<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
  html, body {
    width: 1920px;
    height: 1080px;
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }

  #ticker-bar {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 60px;
    display: flex;
    align-items: stretch;
    font-family: sans-serif;
    font-size: 32px;
    color: white;
  }

  #logo {
    background: #c00;
    color: white;
    padding: 0 20px;
    font-weight: bold;
    font-family: sans-serif;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    min-width: 120px;
    box-shadow: inset 0 -2px 0 rgba(255, 255, 255, 0.2);
    box-sizing: border-box;
    transition: background 0.3s;
  }

  #ticker-text {
    background: linear-gradient(to right, #111 0%, #222 100%);
    flex: 1;
    padding-left: 20px;
    white-space: nowrap;
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
    display: flex;
    align-items: center;
    height: 100%;
    box-sizing: border-box;
    position: relative;
  }

  #ticker-text {
    background: linear-gradient(to right, #111 0%, #222 100%);
    flex: 1;
    padding-left: 20px;
    white-space: nowrap;
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
    display: flex;
    align-items: center;
    height: 100%;
    box-sizing: border-box;
    position: relative;
  }
  .scrolling {
    will-change: transform;
    position: absolute;
    left: 100%;
    white-space: nowrap;
    animation: ticker-scroll linear;
    animation-fill-mode: forwards;
  }
  @keyframes ticker-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
  }

  #center-display {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    max-width: 80%;
    max-height: 80%;
    display: none;
    z-index: 10;
    background: rgba(0,0,0,0.0);
  }

  #center-display img {
    width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
    max-width: 700px;
    max-height: 700px;
  }
  </style>
</head>
<body>
  <div id="ticker-bar">
    <div id="logo">DNN</div>
    <div id="ticker-text">Welcome to the Darmunist News Network.</div>
  </div>
  <div id="center-display"><img src="" alt="overlay" /></div>

<script>
window.onload = () => {
  const tickerText = document.getElementById("ticker-text");
  let tickerQueue = [];
  let isScrolling = false;
  const defaultMessage = "Welcome to the Darmunist News Network.";
  const logo = document.getElementById("logo");
  const centerDisplay = document.getElementById("center-display");
  const centerImg = centerDisplay.querySelector("img");

  // folders relative to overlay.html
  const FOLDERS = {
    heart: "gifs/heart/",
    gif: "gifs/",
  };
  const IMAGE_EXTENSIONS = [".gif", ".jpg", ".jpeg", ".png", ".webp"];

  // How long to display overlays, ms
  const OVERLAY_DISPLAY_TIME = 2500;

  // Default logo/category
  let categoryText = "DNN";

  function setLogo(text) {
    categoryText = (typeof text === "string" && text.length > 0) ? text : "DNN";
    logo.textContent = categoryText;
    // Optionally: add per-category color or style logic here in the future
  }

  setLogo(categoryText);

  const ws = new WebSocket("ws://localhost:8080/ws");

  ws.onopen = () => {
    console.log("✅ WebSocket connection established.");
  };

  ws.onclose = (event) => {
    console.log("❌ WebSocket connection closed:", event);
  };

  ws.onerror = (err) => {
    console.error("❌ WebSocket error:", err);
  };

  ws.onmessage = (event) => {
    console.log("📨 WebSocket message received:", event.data);
    let msg;
    try {
      msg = JSON.parse(event.data);
    } catch (err) {
      console.error("❌ Failed to parse message as JSON:", err);
      return;
    }

    // Ticker: queue up messages for scrolling
    if (msg.type === "ticker" && typeof msg.text === "string") {
      tickerQueue.push(msg.text);
      if (!isScrolling) startTickerScroll();
      return;
    }
    if (msg.type === "image" && typeof msg.url === "string") {
      showCenterImage(msg.url, msg.duration || OVERLAY_DISPLAY_TIME);
      return;
    }
    // NEW: Set logo/category
    if (msg.type === "logo" && typeof msg.text === "string") {
      setLogo(msg.text);
      return;
    }

    // Flexible action handler
    if (msg.action && typeof msg.action === "string") {
      const parsed = parseAction(msg.action);
      if (parsed) {
        const { folder, base } = parsed;
        tryImageExtensions(folder, base, OVERLAY_DISPLAY_TIME);
      } else {
        console.warn("⚠️ Couldn't parse overlay action:", msg.action);
      }
      return;
    }

    console.warn("⚠️ Unknown message format:", msg);
  };

  // Ticker scroll logic
  function startTickerScroll() {
    isScrolling = true;
    // Show default message first
    showStaticTicker(defaultMessage);
    setTimeout(() => {
      if (tickerQueue.length === 0) {
        isScrolling = false;
        showStaticTicker(defaultMessage);
        return;
      }
      // Concatenate all messages in the queue
      const fullMsg = tickerQueue.join(' | ');
      tickerQueue = [];
      scrollTicker(fullMsg, () => {
        // After scroll, revert to default, then restart
        showStaticTicker(defaultMessage);
        setTimeout(() => {
          isScrolling = false;
          if (tickerQueue.length > 0) startTickerScroll();
        }, 2000);
      });
    }, 2000);
  }

  function showStaticTicker(text) {
    tickerText.innerHTML = '';
    tickerText.textContent = text;
  }

  function scrollTicker(text, onComplete) {
    tickerText.innerHTML = '';
    const span = document.createElement('span');
    span.className = 'scrolling';
    span.textContent = text;
    tickerText.appendChild(span);
    // Calculate animation duration based on text length
    const pxPerChar = 22; // adjust for speed
    const duration = Math.max(8, text.length * 0.22); // seconds
    span.style.animationDuration = duration + 's';
    // Remove after animation
    span.addEventListener('animationend', () => {
      tickerText.innerHTML = '';
      if (onComplete) onComplete();
    });
  }

  // Try all supported extensions, show the first image that loads
  function tryImageExtensions(folder, base, duration) {
    let tried = 0;
    let found = false;
    for (const ext of IMAGE_EXTENSIONS) {
      const imgPath = FOLDERS[folder] + base + ext;
      testImage(imgPath, () => {
        if (!found) {
          found = true;
          showCenterImage(imgPath, duration);
        }
      }, () => {
        tried++;
        if (tried === IMAGE_EXTENSIONS.length && !found) {
          console.warn(`⚠️ No image found for ${base} in ${folder}`);
        }
      });
      if (found) break;
    }
  }

  // Preload image to check if it exists
  function testImage(url, onLoad, onError) {
    const img = new window.Image();
    img.onload = onLoad;
    img.onerror = onError;
    img.src = url + '?cachebust=' + Math.random();
  }

  function showCenterImage(imgPath, duration) {
    centerImg.src = imgPath;
    centerDisplay.style.display = "block";
    clearTimeout(centerDisplay._hideTimeout);
    centerDisplay._hideTimeout = setTimeout(() => {
      centerDisplay.style.display = "none";
      centerImg.src = "";
    }, duration);
  }

  // Returns {folder, base} for supported actions, or null
  function parseAction(action) {
    // 1. Heart folder logic: trigger_<base>_heart
    let m = /^trigger_([a-z][a-z0-9]*)(\d*)_heart$/.exec(action);
    if (m) {
      // m[1] is the base (e.g. "dar", "hop"), m[2] is the number if any (e.g. "2", "7", "")
      let base = m[1];
      if (m[2]) base += m[2];
      return { folder: "heart", base };
    }
    // 2. gifs/ folder for non-heart: trigger_<base>
    m = /^trigger_([a-z0-9_]+)$/.exec(action);
    if (m) return { folder: "gif", base: m[1] };
    return null;
  }
};
</script>

</body>
</html>
